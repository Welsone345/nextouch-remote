name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Build
        run: |
          set -eo pipefail
          {
            npm install
            npm run build
            npx cap add android
            node scripts/setup-android.mjs
            npx cap sync android
            (cd android && ./gradlew assembleDebug --console=plain)
          } 2>&1 | tee build.log
      - uses: actions/upload-artifact@v4
        with:
          name: nextouch-remote-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish APK to Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "apk-${{ github.run_number }}" \
            android/app/build/outputs/apk/debug/app-debug.apk \
            --target "${{ github.sha }}" \
            --title "APK #${{ github.run_number }}" \
            --notes "Debug APK, коммит ${{ github.sha }}"
      - name: Report failure in an issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo '```'
            tail -n 150 build.log 2>/dev/null || echo "лога сборки нет"
            echo '```'
          } > body.md
          gh issue create --title "Сборка APK упала (#${{ github.run_number }})" --body-file body.md
